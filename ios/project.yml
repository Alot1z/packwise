name: PackWise
options:
  bundleIdPrefix: com.packwise
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  # NOTE: entitlements belong on targets (below), NOT in options — XcodeGen
  # rejects unknown option keys, which previously killed the CI run at
  # "Generate Xcode project" in 0 seconds.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Testability injects test bundles into Release products. Never ship that.
    ENABLE_TESTABILITY: NO
targets:
  PackWise:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PackWise
        excludes:
          - "**/Widgets"
    # CRITICAL: `path:` is REQUIRED by XcodeGen's Plist decoder. Without it,
    # `entitlements: { properties: ... }` throws `Decoding failed at "path":
    # Nothing found` and the whole spec fails to parse (this exact error has
    # been blocking CI at "Generate Xcode project" for many runs). XcodeGen
    # generates/writes the .entitlements file at `path` from `properties` and
    # wires CODE_SIGN_ENTITLEMENTS automatically.
    entitlements:
      path: PackWise/PackWise.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.packwise
    dependencies:
      - target: PackWiseWidget
        embed: true
    settings:
      base:
        INFOPLIST_FILE: PackWise/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.packwise.app
        PRODUCT_NAME: PackWise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_NAME: AccentColor
        # Real 1024px icon ships in the appiconset (programmatically generated).
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # Device-first, arm64 only — matches the unsigned IPA pipeline and
        # guarantees the packaged executable can run on physical iPhones.
        SUPPORTED_PLATFORMS: "iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  PackWiseWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    # IMPORTANT: do NOT use a bare filename in `excludes:` for the Widget
    # sources. XcodeGen rejects this with "Decoding failed at 'path': Nothing
    # found" and the entire project generation dies in 0 seconds. The
    # Info.plist is already handled correctly via INFOPLIST_FILE below, so
    # it does not need to be excluded from source compilation.
    sources:
      - path: PackWise/Widgets
        excludes:
          - "**/Info.plist"
      - path: PackWise/Models
    # path: REQUIRED (see the note on the app target) — XcodeGen writes the
    # .entitlements file and sets CODE_SIGN_ENTITLEMENTS for this extension.
    entitlements:
      path: PackWise/Widgets/PackWiseWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.packwise
    settings:
      base:
        INFOPLIST_FILE: PackWise/Widgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.packwise.app.widget
        PRODUCT_NAME: PackWiseWidget
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    # NOTE: SwiftData/WidgetKit/SwiftUI are auto-linked by the Swift compiler —
    # no explicit sdk: dependencies needed. Declaring them can trip XcodeGen's
    # SDK resolution on newer toolchains.
  PackWiseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - PackWiseTests
    dependencies:
      - target: PackWise
    settings:
      base:
        SWIFT_VERSION: "6.0"
  PackWiseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - PackWiseUITests
    dependencies:
      - target: PackWise
    settings:
      base:
        SWIFT_VERSION: "6.0"
schemes:
  PackWise:
    # CRITICAL: test targets must NOT be part of the scheme's build/archive
    # action. When they are, `xcodebuild archive` (and the fallback build)
    # can inject PackWiseTests.xctest + XCTest frameworks into the app
    # bundle and — worse — the produced bundle can miss the main executable,
    # which makes sideloaders fail with "Failed to map .../PackWise:
    # Bad file descriptor" (the file is not there).
    #
    # The Widget extension IS part of build/archive — it's embedded in the
    # app bundle as a proper app extension.
    build:
      targets:
        PackWise: all
        PackWiseWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PackWiseTests
        - PackWiseUITests
    archive:
      config: Release
