name: PackWise
options:
  bundleIdPrefix: com.packwise
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PackWise:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PackWise
    settings:
      base:
        INFOPLIST_FILE: PackWise/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.packwise.app
        PRODUCT_NAME: PackWise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: PackWise/Info.plist
      properties:
        CFBundleDisplayName: PackWise
        CFBundleName: PackWise
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: YES

schemes:
  PackWise:
    build:
      targets:
        PackWise: all
    run:
      config: Debug
    archive:
      config: Release
