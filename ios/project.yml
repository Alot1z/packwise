name: PackWise
options:
  bundleIdPrefix: com.packwise
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Testability injects test bundles into Release products. Never ship that.
    ENABLE_TESTABILITY: NO
targets:
  PackWise:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PackWise
    settings:
      base:
        INFOPLIST_FILE: PackWise/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.packwise.app
        PRODUCT_NAME: PackWise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_NAME: AccentColor
        # Real 1024px icon ships in the appiconset (programmatically generated).
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        # Device-first, arm64 only — matches the unsigned IPA pipeline and
        # guarantees the packaged executable can run on physical iPhones.
        SUPPORTED_PLATFORMS: "iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  PackWiseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PackWiseTests
    dependencies:
      - target: PackWise
    settings:
      base:
        SWIFT_VERSION: "5.9"
  PackWiseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PackWiseUITests
    dependencies:
      - target: PackWise
    settings:
      base:
        SWIFT_VERSION: "5.9"
schemes:
  PackWise:
    # CRITICAL: test targets must NOT be part of the scheme's build/archive
    # action. When they are, `xcodebuild archive` (and the fallback build)
    # can inject PackWiseTests.xctest + XCTest frameworks into the app
    # bundle and — worse — the produced bundle can miss the main executable,
    # which makes sideloaders fail with "Failed to map .../PackWise:
    # Bad file descriptor" (the file is not there).
    build:
      targets:
        PackWise: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PackWiseTests
        - PackWiseUITests
    archive:
      config: Release
