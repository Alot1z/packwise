name: PackWise
options:
  bundleIdPrefix: com.packwise
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PackWise:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PackWise
    settings:
      base:
        INFOPLIST_FILE: PackWise/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.packwise.app
        PRODUCT_NAME: PackWise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
  PackWiseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PackWiseTests
    dependencies:
      - target: PackWise
    settings:
      base:
        SWIFT_VERSION: "5.9"
  PackWiseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PackWiseUITests
    dependencies:
      - target: PackWise
    settings:
      base:
        SWIFT_VERSION: "5.9"
schemes:
  PackWise:
    build:
      targets:
        PackWise: all
        PackWiseTests: all
        PackWiseUITests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PackWiseTests
        - PackWiseUITests
    archive:
      config: Release
