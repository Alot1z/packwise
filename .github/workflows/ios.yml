name: iOS — PackWise

on:
  push:
    branches: [main]
    # Change-based execution: only start the pipeline when relevant inputs moved.
    # Tags (v*) always run the full pipeline regardless of paths.
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".gitea/workflows/ios.yml"
      - "scripts/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.*"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner_image:
        description: 'macOS runner image (not Xcode version — the workflow selects the newest installed Xcode on the image)'
        type: choice
        required: false
        default: 'macos-15'
        options: ['macos-14', 'macos-15']
      skip_tests:
        description: 'Skip simulator tests for a faster IPA-only build'
        type: boolean
        required: false
        default: false
      release_channel:
        description: 'Which release channel to publish to (push events ignore this; dispatch defaults to dev)'
        type: choice
        required: false
        default: 'auto'
        options: ['auto', 'dev']

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Web / static validation — runs in PARALLEL with the iOS build on Ubuntu.
  # Catches TypeScript, Vite build, YAML, and shell regressions without
  # burning macOS minutes. Caches Bun dependencies keyed on the lockfile.
  # ──────────────────────────────────────────────────────────────────────────
  web-static-validation:
    name: Web + static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies (lockfile-keyed)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun tsc -b --noEmit

      - name: Production build
        run: bun run build

      - name: Shell syntax check
        run: |
          bash -n ios/build.sh && echo "build.sh OK"
          for s in scripts/*.sh; do bash -n "$s" && echo "$s OK"; done

      - name: Workflow YAML parse
        run: |
          npx js-yaml .github/workflows/ios.yml > /dev/null && echo "ios.yml OK"
          npx js-yaml .github/workflows/wiki.yml > /dev/null && echo "wiki.yml OK"
          npx js-yaml .gitea/workflows/ios.yml > /dev/null && echo "gitea ios.yml OK"

      - name: XcodeGen spec sanity (YAML)
        run: npx js-yaml ios/project.yml > /dev/null && echo "project.yml YAML OK"

  # ──────────────────────────────────────────────────────────────────────────
  # iOS build — the authoritative Apple pipeline on a macOS runner.
  #
  # Caching strategy (inputs & acceleration data only — NEVER release artifacts):
  #   A. Xcode            → runner-provided, selected deterministically (newest),
  #                         NEVER downloaded.
  #   B. iOS device platform → cache keyed by exact Xcode version; restored via
  #                         sudo, VALIDATED with xcodebuild -showsdks, and the
  #                         official download remains the fallback. A corrupt
  #                         cache can never conceal a missing platform.
  #   C. XcodeGen         → pinned 2.46.0, cached in the runner tool cache.
  #   D. DerivedData/SPM  → intentionally NOT cached: correctness first. The
  #                         archive/device build always compiles fresh so stale
  #                         objects can never hide a source regression.
  #   E. IPA / releases   → always freshly produced by this run's build.sh.
  # ──────────────────────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ${{ inputs.runner_image || 'macos-15' }}
    timeout-minutes: 45
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCGEN_DIR: ${{ runner.tool_cache }}/xcodegen-2.46.0
    steps:
      - uses: actions/checkout@v5

      - name: Record environment
        run: |
          echo "=== macOS ==="; sw_vers
          echo "=== Xcode selection ==="; xcode-select -p
          echo "=== Xcode version ==="; xcodebuild -version
          echo "=== Swift version ==="; swift --version
          echo "=== SDKs ==="; xcodebuild -showsdks 2>&1 | grep -E 'iphoneos|iOS|iPhoneOS'
          echo "=== SDK versions ==="; xcrun --sdk iphoneos --show-sdk-version 2>&1; xcrun --sdk iphonesimulator --show-sdk-version 2>&1

      - name: Select newest Xcode (deterministic) + record version
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ] && [ -d /Applications/Xcode.app ]; then XCODE=/Applications/Xcode.app; fi
          if [ -n "$XCODE" ]; then
            echo "selected: $XCODE"
            sudo xcode-select -s "$XCODE/Contents/Developer"
          else
            echo "using default Xcode path"
          fi
          echo "XCODE_VERSION=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_ENV"
          echo "SWIFT_VERSION=$(swift --version 2>/dev/null | awk 'NR==1{print $4}')" >> "$GITHUB_ENV"
          xcodebuild -version

      # ── Runner-images #12758/#12862/#13570: macOS-15 images trim the iOS
      # DEVICE platform to save disk. We cache the installed platform keyed by
      # the EXACT Xcode version, restore it with sudo, and only fall back to the
      # official `xcodebuild -downloadPlatform iOS` if validation fails.
      - name: Cache iOS device platform (keyed by Xcode version)
        id: platform-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ios-platform
          key: ios-platform-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}

      - name: Restore iOS device platform from cache
        id: platform-restore
        if: steps.platform-cache.outputs.cache-hit == 'true'
        run: |
          PLATFORM_DIR="$(xcode-select -p)/Platforms"
          if [ -d "/tmp/ios-platform/iPhoneOS.platform" ]; then
            echo "→ restoring cached device platform (Xcode $XCODE_VERSION)"
            sudo mkdir -p "$PLATFORM_DIR"
            sudo cp -R /tmp/ios-platform/iPhoneOS.platform "$PLATFORM_DIR/"
            if xcodebuild -showsdks | grep -qi iphoneos; then
              echo "PLATFORM_READY=1" >> "$GITHUB_ENV"
              echo "→ device platform usable after cache restore"
            else
              echo "→ cache restore produced no usable platform — will download fresh"
            fi
          fi

      - name: Install iOS device platform (on demand)
        if: env.PLATFORM_READY != '1'
        run: |
          echo "→ xcodebuild -downloadPlatform iOS (official remedy; cached for next run)"
          xcodebuild -downloadPlatform iOS 2>&1 | tail -n 8 || \
            { echo "→ retrying with sudo (platform dir is root-owned on runners)"; sudo xcodebuild -downloadPlatform iOS 2>&1 | tail -n 8; }
          echo "→ staging platform into the cache path"
          mkdir -p /tmp/ios-platform
          sudo cp -R "$(xcode-select -p)/Platforms/iPhoneOS.platform" /tmp/ios-platform/ 2>/dev/null || echo "   (platform copy skipped)"
          echo "→ device SDKs now available:"
          xcodebuild -showsdks | grep -i iphoneos || echo "  (none listed — see output above)"

      # ── XcodeGen: pinned version, cached in runner.tool_cache. Never download
      # the same release twice. Version is still verified on every run.
      - name: Cache XcodeGen binary
        id: xcodegen-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.XCGEN_DIR }}
          key: xcodegen-${{ runner.os }}-${{ env.XCODEGEN_VERSION }}

      - name: Install XcodeGen (cache miss → brew → official binary)
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$XCGEN_DIR"
          if command -v xcodegen >/dev/null 2>&1 && xcodegen --version | grep -q "$XCODEGEN_VERSION"; then
            echo "xcodegen $XCODEGEN_VERSION already installed — copying into cache"
            cp "$(command -v xcodegen)" "$XCGEN_DIR/xcodegen"
          elif brew install xcodegen; then
            echo "installed xcodegen via Homebrew: $(xcodegen --version)"
            cp "$(command -v xcodegen)" "$XCGEN_DIR/xcodegen"
          else
            echo "brew failed — installing xcodegen $XCODEGEN_VERSION from the official release binary"
            curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/${{ env.XCODEGEN_VERSION }}/xcodegen.zip
            unzip -o /tmp/xcodegen.zip -d "$XCGEN_DIR"
          fi
          chmod +x "$XCGEN_DIR/xcodegen"

      - name: Link XcodeGen into PATH + verify
        run: |
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$XCGEN_DIR/xcodegen" /usr/local/bin/xcodegen
          echo "→ xcodegen version: $(xcodegen --version)"

      # ── Generate the Xcode project. Failures here are emitted as public
      # ::error:: annotations so the root cause is readable without sign-in
      # (logs/artifacts require auth; annotations do not).
      - name: Generate Xcode project
        working-directory: ios
        run: |
          set +e
          OUTPUT=$(xcodegen generate 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT -ne 0 ]; then
            LAST=$(echo "$OUTPUT" | grep -iE 'error|invalid|failed|unexpected' | tail -n 3 | tr '\n' ' ')
            echo "::error::xcodegen generate failed (exit $EXIT): ${LAST:-see step log}"
            exit $EXIT
          fi
          ls -lh PackWise.xcodeproj

      # ── Tests: informative, non-blocking. A flaky test must never block the IPA. ──
      - name: Run tests (simulator, no signing — non-blocking)
        id: tests
        if: ${{ !inputs.skip_tests }}
        continue-on-error: true
        working-directory: ios
        run: |
          # GitHub runs steps with `bash -e -o pipefail` by default: a failing
          # xcodebuild test would abort this script before `exit 0`, turning the
          # "non-blocking" step into a hard failure. Disable errexit around the
          # pipeline, capture the real status, and always exit 0 so a test flake
          # can never block the IPA.
          #
          # Resolve a usable iPhone simulator at runtime (Xcode 26 doesn't ship
          # "iPhone 16" — query available devices and pick the first iPhone).
          mkdir -p build
          SIM_DEST="platform=iOS Simulator,name=iPhone 17,OS=latest"
          if ! xcrun simctl list devices available "${SIM_DEST##name=}" 2>/dev/null | grep -q iPhone; then
            FIRST_IPHONE=$(xcrun simctl list devices available iPhone 2>/dev/null | grep -m1 -oE 'iPhone [0-9]+( Pro( Max)?)?' | head -1)
            if [ -n "$FIRST_IPHONE" ]; then
              SIM_DEST="platform=iOS Simulator,name=$FIRST_IPHONE,OS=latest"
              echo "→ no iPhone 17 simulator — using: $SIM_DEST"
            else
              echo "→ no iPhone simulator found — tests will be skipped (exit 0)"
              exit 0
            fi
          fi
          echo "→ Running tests on $SIM_DEST (never blocks the IPA build)"
          set +e
          xcodebuild test \
            -project PackWise.xcodeproj -scheme PackWise \
            -destination "$SIM_DEST" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/tests.log | tail -n 120
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$TEST_EXIT" = "0" ]; then echo "TESTS_PASSED=1" >> "$GITHUB_ENV"; else echo "TESTS_PASSED=0" >> "$GITHUB_ENV"; fi
          echo "Tests exited $TEST_EXIT — continuing to build the IPA regardless."
          exit 0

      # ── THE REAL PRODUCT: ios/build.sh — self-healing cascade + strict gate ──
      # Tries device build → archive → legacy build, validates the main
      # executable (exists, non-empty, arm64, LC_BUILD_VERSION platform 2),
      # strips test injection, and refuses to publish unless the final .ipa
      # passes the gate (Payload/PackWise.app/PackWise present, no test bundles).
      - name: Build unsigned IPA (device, arm64 — validated)
        id: ipa
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p build
          ./build.sh 2>&1 | tee build/ci.log
          echo "BUILT_UNSIGNED_IPA=1" >> "$GITHUB_ENV"

      # ── Final gate: the same verifier users run locally (scripts/verify-ipa.sh).
      - name: Verify IPA (publish gate)
        if: env.BUILT_UNSIGNED_IPA == '1'
        run: ./scripts/verify-ipa.sh ios/build/PackWise-unsigned.ipa

      # ── Algorithm-friendly release manifest — attached to every published
      # release so any AI / script can fetch one JSON and find the newest
      # stable build, the freshest dev prerelease, and recent release history
      # with sha256s. Schema: packwise.releases/v1.
      - name: Generate release manifest (${{ inputs.release_channel || 'auto' }})
        if: env.BUILT_UNSIGNED_IPA == '1'
        run: |
          set -euo pipefail
          mkdir -p _artifacts

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release_channel }}" = "dev" ]; then
            TAG="dev"; PREREL=1
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="dev"; PREREL=1
          else
            case "${GITHUB_REF:-}" in
              refs/tags/v*) TAG="${GITHUB_REF#refs/tags/}"; PREREL=0;;
              refs/heads/main) TAG="dev"; PREREL=1;;
              *) TAG="dev"; PREREL=1;;
            esac
          fi

          PRIOR=""
          if [ "$TAG" = "dev" ]; then
            echo "→ fetching prior manifest from dev release"
            if curl -fsSL --retry 2 --max-time 20 \
                 -o _artifacts/prior.json \
                 "https://github.com/${GITHUB_REPOSITORY}/releases/download/dev/PackWise-releases.json"; then
              PRIOR="--prior _artifacts/prior.json"
              echo "   loaded prior ($(wc -c <_artifacts/prior.json) bytes)"
            else
              echo "   no prior manifest (first publish or asset missing) — starting fresh"
              rm -f _artifacts/prior.json
            fi
          fi

          ./scripts/release-manifest.sh \
            --tag "$TAG" \
            --ipa ios/build/PackWise-unsigned.ipa \
            --output _artifacts/PackWise-releases.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verified \
            $([ "$PREREL" = "1" ] && echo --prerelease) \
            $PRIOR

          python3 -c "
          import json, sys
          m = json.load(open('_artifacts/PackWise-releases.json'))
          assert m['schema'] == 'packwise.releases/v1', 'schema mismatch'
          assert m['repository'] == '${GITHUB_REPOSITORY}', 'repo mismatch'
          print('manifest validated: latest=', (m.get('latest') or {}).get('tag'), 'dev=', (m.get('dev') or {}).get('tag'), 'count=', len(m['releases']))
          "

      - name: Publish to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v') && env.BUILT_UNSIGNED_IPA == '1'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
            _artifacts/PackWise-releases.json
          generate_release_notes: true

      - name: Publish dev prerelease (every main push — 1-click .ipa)
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.BUILT_UNSIGNED_IPA == '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: dev — latest main build
          prerelease: true
          generate_release_notes: true
          files: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
            _artifacts/PackWise-releases.json

      - name: Upload unsigned IPA (debug artifact — unwrap once to .ipa)
        if: env.BUILT_UNSIGNED_IPA == '1'
        uses: actions/upload-artifact@v7
        with:
          name: PackWise-unsigned-ipa
          path: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics (always — readable without sign-in)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-diagnostics
          path: |
            ios/build/build.log
            ios/build/tests.log
            ios/build/ci.log
            ios/build/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### PackWise — iOS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** macOS \`$(sw_vers -productVersion)\` · Xcode \`$XCODE_VERSION\` · Swift \`$SWIFT_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${TESTS_PASSED:-0}" = "1" ]; then
            echo "**Tests:** ✅ passed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${TESTS_PASSED:-0}" = "0" ]; then
            echo "**Tests:** ⚠️ failed (non-blocking) — see tests.log in the diagnostics artifact" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Tests:** ⏭️ skipped or not run" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${BUILT_UNSIGNED_IPA:-0}" = "1" ]; then
            echo "✅ **Unsigned IPA produced — \`PackWise-unsigned.ipa\`**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Validated: \`Payload/PackWise.app/PackWise\` present, arm64 device Mach-O, no test bundles" >> "$GITHUB_STEP_SUMMARY"
            echo "- Direct .ipa (no unwrap): **[dev](https://github.com/${{ github.repository }}/releases/tag/dev)** (every main push + dispatch) and **[Latest](https://github.com/${{ github.repository }}/releases/latest)** (tag \`v*\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Algorithm-friendly manifest** \`PackWise-releases.json\` attached ([dev](https://github.com/${{ github.repository }}/releases/download/dev/PackWise-releases.json) · [latest](https://github.com/${{ github.repository }}/releases/latest/download/PackWise-releases.json))" >> "$GITHUB_STEP_SUMMARY"
            echo "- Verify: \`./scripts/verify-ipa.sh <file>\` · \`shasum -a 256\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **No IPA produced** — the Build step failed; see the \`ios-build-diagnostics\` artifact." >> "$GITHUB_STEP_SUMMARY"
            if [ -f "ios/build/diagnostics.txt" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "<details><summary>Last diagnostics (from diagnostics.txt)</summary>" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              tail -n 60 ios/build/diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "TestFlight / App Store are **not** claimed — that requires Apple signing and App Store Connect processing (see ios/README.md)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Logs: [Live run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · [Wiki](https://github.com/$GITHUB_REPOSITORY/wiki) · [Releases](https://github.com/${{ github.repository }}/releases)" >> "$GITHUB_STEP_SUMMARY"
