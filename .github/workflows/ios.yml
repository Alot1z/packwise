name: iOS — PackWise

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml", ".gitea/workflows/ios.yml", "scripts/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner_image:
        description: 'macOS runner image (not Xcode version — the workflow selects the newest installed Xcode on the image)'
        type: choice
        required: false
        default: 'macos-15'
        options: ['macos-14', 'macos-15']
      skip_tests:
        description: 'Skip simulator tests for a faster IPA-only build'
        type: boolean
        required: false
        default: false
      download_simulator:
        description: 'Download the iOS Simulator runtime if missing (slow: ~5-10 min on runners without it)'
        type: boolean
        required: false
        default: false
      release_channel:
        description: 'Which release channel to publish to (push events ignore this; dispatch defaults to dev)'
        type: choice
        required: false
        default: 'auto'
        options: ['auto', 'dev']

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ${{ inputs.runner_image || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Record environment
        run: |
          echo "=== macOS ==="; sw_vers
          echo "=== Xcode selection ==="; xcode-select -p
          echo "=== Xcode version ==="; xcodebuild -version
          echo "=== Swift version ==="; swift --version
          echo "=== SDKs ==="; xcodebuild -showsdks 2>&1 | grep -E 'iphoneos|iOS|iPhoneOS'
          echo "=== SDK versions ==="; xcrun --sdk iphoneos --show-sdk-version 2>&1; xcrun --sdk iphonesimulator --show-sdk-version 2>&1
          echo "=== Device platform ==="; xcodebuild -showsdks 2>&1 | grep iphoneos || echo "  device SDK NOT VISIBLE — will attempt download"

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ] && [ -d /Applications/Xcode.app ]; then XCODE=/Applications/Xcode.app; fi
          if [ -n "$XCODE" ]; then
            echo "selected: $XCODE"
            sudo xcode-select -s "$XCODE/Contents/Developer"
          else
            echo "using default Xcode path"
          fi
          xcodebuild -version

      # ── Runner-images #12758/#12862/#13570: macOS-15 images trim the iOS
      # DEVICE platform to save disk. `xcodebuild -destination
      # "generic/platform=iOS"` then dies in <1s with "Unable to find a
      # destination ... iOS 18.0 is not installed". Official fix: download the
      # platform on demand (no-op if already present).
      - name: Install iOS device platform (on demand)
        run: |
          echo "→ xcodebuild -downloadPlatform iOS (no-op if already installed)"
          xcodebuild -downloadPlatform iOS 2>&1 | tail -n 8 || \
            { echo "→ retrying with sudo (platform dir is root-owned on runners)"; sudo xcodebuild -downloadPlatform iOS 2>&1 | tail -n 8; }
          echo "→ device SDKs now available:"
          xcodebuild -showsdks | grep -i iphoneos || echo "  (none listed — see output above)"

      - name: Install XcodeGen
        run: |
          # Runner hygiene: an unused untrusted tap (e.g. aws/tap) makes Homebrew
          # refuse commands until trusted. We never use that tap — remove it if
          # present (never disable tap-trust globally). Fall back to XcodeGen's
          # official release binary if brew still fails, so a Homebrew hiccup can
          # never block the IPA build.
          brew untap aws/tap 2>/dev/null || true
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version 2>/dev/null || echo present)"
          elif brew install xcodegen; then
            echo "installed xcodegen via Homebrew: $(xcodegen --version 2>/dev/null || echo present)"
          else
            echo "brew failed — installing xcodegen from the official release binary"
            curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
            sudo mkdir -p /usr/local/bin
            sudo unzip -o /tmp/xcodegen.zip -d /usr/local/bin
            sudo chmod +x /usr/local/bin/xcodegen
            xcodegen --version
          fi

      # ::error:: is emitted on failure so the root cause is readable via the
      # public check-runs/{id}/annotations endpoint without sign-in (logs require
      # admin; annotations do not). This made run 31317701450 debuggable at all.
      - name: Generate Xcode project
        working-directory: ios
        run: |
          set +e
          OUTPUT=$(xcodegen generate 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT -ne 0 ]; then
            LAST=$(echo "$OUTPUT" | grep -iE 'error|invalid|failed|unexpected' | tail -n 3 | tr '\n' ' ')
            echo "::error::xcodegen generate failed (exit $EXIT): ${LAST:-see step log}"
            exit $EXIT
          fi
          ls -lh PackWise.xcodeproj

      # ── Compile gate for ALL test code (blocking, fails fast, no simulator) ──
      # The scheme deliberately excludes test targets from the archive build and
      # the hosted runner has no iOS Simulator runtime — so test code was never
      # even compiled in CI. build-for-testing against the generic iOS DEVICE
      # destination compiles every test target (unit + UI) against the
      # device-slice app, so a broken test (wrong API, bad signature, bad
      # fixture) reds the build instead of shipping silently. This runs before
      # the IPA so the fastest signal wins.
      - name: Compile tests (build-for-testing — blocking gate)
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project PackWise.xcodeproj -scheme PackWise \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/tests-compile.log | tail -n 40
          echo "→ test targets compiled OK (PackWiseTests + PackWiseUITests)"

      # ── Tests: informative, non-blocking. A flaky test must never block the IPA. ──
      - name: Run tests (simulator, no signing — non-blocking)
        id: tests
        if: ${{ !inputs.skip_tests }}
        continue-on-error: true
        working-directory: ios
        run: |
          # GitHub runs steps with `bash -e -o pipefail` by default: a failing
          # xcodebuild test would abort this script before `exit 0`, turning the
          # "non-blocking" step into a hard failure that propagates xcodebuild's
          # exit code (65/70) and never records TESTS_PASSED. Disable errexit
          # around the pipeline, capture the real status, and always exit 0 so a
          # test flake can never block the IPA or produce a misleading failure.
          #
          # Resolve a usable iPhone simulator at runtime. Device NAMES can
          # exist in simctl even when no simulator runtime is installed (the
          # runner image may omit it), so check runtimes first — otherwise
          # xcodebuild reports "Unable to find a device" and the step lies
          # with TESTS_PASSED=0 instead of honestly skipping.
          mkdir -p build
          if ! xcrun simctl list runtimes available 2>/dev/null | grep -qiE '^iOS|iOS [0-9]'; then
            if [ "${{ inputs.download_simulator }}" = "true" ]; then
              echo "→ no iOS Simulator runtime — downloading (can take 5-10 min)..."
              xcodebuild -downloadPlatform iOS-Simulator 2>&1 | tail -n 5 || \
                { echo "→ retrying with sudo (platform dir is root-owned on runners)"; sudo xcodebuild -downloadPlatform iOS-Simulator 2>&1 | tail -n 5; }
            fi
            if ! xcrun simctl list runtimes available 2>/dev/null | grep -qiE '^iOS|iOS [0-9]'; then
              echo "TESTS_SKIPPED=1" >> "$GITHUB_ENV"
              echo "→ no iOS Simulator runtime on this runner — tests skipped (exit 0)."
              echo "  Re-run with download_simulator=true to install it, or use a runner image that ships simulators."
              exit 0
            fi
          fi
          # Resolve an actual simulator DEVICE UDID by CREATING a fresh device
          # on the newest available runtime. Pre-existing device rows on the
          # runner images are often unbacked phantoms (they list in simctl but
          # xcodebuild reports "Unable to find a destination" for them), so
          # reuse an existing UDID only as a fallback when creation fails.
          SIM_DEST=""
          DEV_UDID=""
          DEV_TYPE=$(xcrun simctl list devicetypes 2>/dev/null | grep -m1 'iPhone' | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-[0-9A-Za-z-]+' | head -1)
          RUNTIME_ID=$(xcrun simctl list runtimes available 2>/dev/null | grep -m1 'iOS' | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | head -1)
          if [ -n "$DEV_TYPE" ] && [ -n "$RUNTIME_ID" ]; then
            DEV_UDID=$(xcrun simctl create "PackWise Test iPhone" "$DEV_TYPE" "$RUNTIME_ID" 2>/dev/null || true)
            echo "→ created fresh simulator device: ${DEV_UDID:-failed}"
          fi
          if [ -z "$DEV_UDID" ]; then
            DEV_UDID=$(xcrun simctl list devices available 2>/dev/null | grep -m1 'iPhone' | grep -oE '[0-9A-F-]{36}' | head -1)
          fi
          if [ -z "$DEV_UDID" ]; then
            echo "TESTS_SKIPPED=1" >> "$GITHUB_ENV"
            echo "→ no usable iPhone simulator device — tests skipped (exit 0)."
            exit 0
          fi
          SIM_DEST="platform=iOS Simulator,id=$DEV_UDID"
          echo "→ using simulator: $SIM_DEST"
          echo "→ Running tests on $SIM_DEST (never blocks the IPA build)"
          set +e
          xcodebuild test \
            -project PackWise.xcodeproj -scheme PackWise \
            -destination "$SIM_DEST" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/tests.log | tail -n 120
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$TEST_EXIT" = "0" ]; then echo "TESTS_PASSED=1" >> "$GITHUB_ENV"; else echo "TESTS_PASSED=0" >> "$GITHUB_ENV"; fi
          echo "Tests exited $TEST_EXIT — continuing to build the IPA regardless."
          exit 0

      # ── THE REAL PRODUCT: ios/build.sh — self-healing cascade + strict gate ──
      # Tries device build → archive → legacy build, validates the main
      # executable (exists, non-empty, arm64, LC_BUILD_VERSION platform 2),
      # strips test injection, and refuses to publish unless the final .ipa
      # passes the gate (Payload/PackWise.app/PackWise present, no test bundles).
      - name: Build unsigned IPA (device, arm64 — validated)
        id: ipa
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p build
          ./build.sh 2>&1 | tee build/ci.log
          echo "BUILT_UNSIGNED_IPA=1" >> "$GITHUB_ENV"

      # ── Final gate: the same verifier users run locally (scripts/verify-ipa.sh).
      # Belt-and-suspenders on top of build.sh's internal publish gate — and
      # keeps ONE public tool that explains any download, .ipa or artifact zip.
      - name: Verify IPA (publish gate)
        if: env.BUILT_UNSIGNED_IPA == '1'
        run: ./scripts/verify-ipa.sh ios/build/PackWise-unsigned.ipa

      # ── Algorithm-friendly release manifest — attached to every published
      # release so any AI / script can fetch one JSON and find the newest
      # stable build, the freshest dev prerelease, and recent release history
      # with sha256s. Schema: packwise.releases/v1.
      #
      # Stable URLs (no GitHub API key required):
      #   releases/latest/download/PackWise-releases.json
      #   releases/dev/download/PackWise-releases.json
      #   releases/vX.Y.Z/download/PackWise-releases.json
      - name: Generate release manifest (${{ inputs.release_channel || 'auto' }})
        if: env.BUILT_UNSIGNED_IPA == '1'
        run: |
          set -euo pipefail
          mkdir -p _artifacts

          # Decide tag + prerelease based on trigger + dispatch inputs.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release_channel }}" = "dev" ]; then
            TAG="dev"; PREREL=1
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="dev"; PREREL=1
          else
            case "${GITHUB_REF:-}" in
              refs/tags/v*) TAG="${GITHUB_REF#refs/tags/}"; PREREL=0;;
              refs/heads/main) TAG="dev"; PREREL=1;;
              *) TAG="dev"; PREREL=1;;
            esac
          fi

          PRIOR=""
          # For dev prerelease, re-fetch the prior manifest so history accumulates.
          if [ "$TAG" = "dev" ]; then
            echo "→ fetching prior manifest from dev release"
            if curl -fsSL --retry 2 --max-time 20 \
                 -o _artifacts/prior.json \
                 "https://github.com/${GITHUB_REPOSITORY}/releases/download/dev/PackWise-releases.json"; then
              PRIOR="--prior _artifacts/prior.json"
              echo "   loaded prior ($(wc -c <_artifacts/prior.json) bytes)"
            else
              echo "   no prior manifest (first publish or asset missing) — starting fresh"
              rm -f _artifacts/prior.json
            fi
          fi

          ./scripts/release-manifest.sh \
            --tag "$TAG" \
            --ipa ios/build/PackWise-unsigned.ipa \
            --output _artifacts/PackWise-releases.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verified \
            $([ "$PREREL" = "1" ] && echo --prerelease) \
            $PRIOR

          # Validate the produced JSON before publishing.
          python3 -c "
          import json, sys
          m = json.load(open('_artifacts/PackWise-releases.json'))
          assert m['schema'] == 'packwise.releases/v1', 'schema mismatch'
          assert m['repository'] == '${GITHUB_REPOSITORY}', 'repo mismatch'
          print('manifest validated: latest=', (m.get('latest') or {}).get('tag'), 'dev=', (m.get('dev') or {}).get('tag'), 'count=', len(m['releases']))
          "

      # ── Direct .ipa download (no outer zip) — versioned Release on tag v* ──
      - name: Publish to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v') && env.BUILT_UNSIGNED_IPA == '1'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
            _artifacts/PackWise-releases.json
          generate_release_notes: true

      # ── Direct .ipa — auto dev prerelease on every push to main ──
      - name: Publish dev prerelease (every main push — 1-click .ipa)
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.BUILT_UNSIGNED_IPA == '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: dev — latest main build
          prerelease: true
          generate_release_notes: true
          files: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
            _artifacts/PackWise-releases.json

      # ── Debug artifact — GitHub wraps this in an outer .zip on download ──
      - name: Upload unsigned IPA (debug artifact — unwrap once to .ipa)
        if: env.BUILT_UNSIGNED_IPA == '1'
        uses: actions/upload-artifact@v7
        with:
          name: PackWise-unsigned-ipa
          path: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      # ── Diagnostics are ALWAYS uploaded so any failure is publicly readable ──
      - name: Upload build diagnostics (always — readable without sign-in)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-diagnostics
          path: |
            ios/build/build.log
            ios/build/tests.log
            ios/build/tests-compile.log
            ios/build/ci.log
            ios/build/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### PackWise — iOS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${TESTS_PASSED:-0}" = "1" ]; then
            echo "**Tests:** ✅ passed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${TESTS_SKIPPED:-0}" = "1" ]; then
            echo "**Tests:** ⏭️ skipped — no iOS Simulator runtime on this runner (re-run with download_simulator=true to install it)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${TESTS_PASSED:-0}" = "0" ]; then
            echo "**Tests:** ⚠️ failed (non-blocking) — see tests.log in the diagnostics artifact" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Tests:** ⏭️ skipped or not run" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${BUILT_UNSIGNED_IPA:-0}" = "1" ]; then
            echo "✅ **Unsigned IPA produced — \`PackWise-unsigned.ipa\`**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Validated: \`Payload/PackWise.app/PackWise\` present, arm64 device Mach-O, no test bundles" >> "$GITHUB_STEP_SUMMARY"
            echo "- Direct .ipa (no unwrap): **[dev](https://github.com/${{ github.repository }}/releases/tag/dev)** (every main push + dispatch) and **[Latest](https://github.com/${{ github.repository }}/releases/latest)** (tag \`v*\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Algorithm-friendly manifest** \`PackWise-releases.json\` attached ([dev](https://github.com/${{ github.repository }}/releases/download/dev/PackWise-releases.json) · [latest](https://github.com/${{ github.repository }}/releases/latest/download/PackWise-releases.json)) — scripts can fetch one URL to find the newest stable + dev + history" >> "$GITHUB_STEP_SUMMARY"
            echo "- Artifact \`PackWise-unsigned-ipa\` is an outer zip — unwrap once to get the \`.ipa\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Verify: \`./scripts/verify-ipa.sh <file>\` · \`shasum -a 256\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **No IPA produced** — the Build step failed; see the \`ios-build-diagnostics\` artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "   No release was published by this run — any previously published \`dev\` asset is stale and must not be trusted until a new build passes the gate." >> "$GITHUB_STEP_SUMMARY"
            if [ -f "ios/build/diagnostics.txt" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "<details><summary>Last diagnostics (from diagnostics.txt)</summary>" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              tail -n 60 ios/build/diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "TestFlight / App Store are **not** claimed — that requires Apple signing and App Store Connect processing (see ios/README.md)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Logs: [Live run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · [Wiki](https://github.com/$GITHUB_REPOSITORY/wiki) · [Releases](https://github.com/${{ github.repository }}/releases)" >> "$GITHUB_STEP_SUMMARY"
