name: iOS — PackWise

on:
  push:
    branches: [main]
    paths: [ "ios/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16*.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer; xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run tests (simulator, no signing)
        working-directory: ios
        run: |
          xcodebuild test \
            -project PackWise.xcodeproj \
            -scheme PackWise \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcpretty || xcodebuild test -project PackWise.xcodeproj -scheme PackWise -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" CODE_SIGNING_ALLOWED=NO

      - name: Archive — unsigned IPA
        working-directory: ios
        run: |
          set -e
          xcodebuild archive \
            -project PackWise.xcodeproj \
            -scheme PackWise \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PackWise.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            || echo "ARCHIVE_FAILED=true" >> $GITHUB_ENV

          if [ -f build/PackWise.xcarchive/Products/Applications/PackWise.app/Info.plist ]; then
            rm -rf build/Payload build/PackWise-unsigned.ipa
            mkdir -p build/Payload
            cp -R build/PackWise.xcarchive/Products/Applications/PackWise.app build/Payload/
            (cd build && zip -r PackWise-unsigned.ipa Payload >/dev/null)
            echo "BUILT_UNSIGNED_IPA=1" >> $GITHUB_ENV
            ls -lh build/PackWise-unsigned.ipa
          fi

      - name: Upload unsigned IPA
        if: env.BUILT_UNSIGNED_IPA == '1'
        uses: actions/upload-artifact@v4
        with:
          name: PackWise-unsigned-ipa
          path: ios/build/PackWise-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        run: |
          echo "### PackWise — iOS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$BUILT_UNSIGNED_IPA" = "1" ]; then
            echo "✅ Tests ran. Unsigned IPA produced: \`PackWise-unsigned.ipa\` (AltStore / Sideloadly / TrollStore)." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Archive did not produce an app bundle. No IPA artifact." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "TestFlight / App Store are **not** claimed — that requires Apple signing and App Store Connect processing (see ios/README.md)." >> $GITHUB_STEP_SUMMARY
