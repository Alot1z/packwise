name: iOS — PackWise

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml", ".gitea/workflows/ios.yml", "scripts/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          for d in /Applications/Xcode_*.app /Applications/Xcode.app; do
            if [ -d "$d" ]; then sudo xcode-select -s "$d/Contents/Developer"; break; fi
          done
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate && ls -lh PackWise.xcodeproj

      # ── Tests: informative, non-blocking. A flaky test must never block the IPA. ──
      - name: Run tests (simulator, no signing — non-blocking)
        id: tests
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          echo "→ Running tests (never blocks the IPA build)"
          xcodebuild test \
            -project PackWise.xcodeproj -scheme PackWise \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/tests.log | tail -n 120
          TEST_EXIT=${PIPESTATUS[0]}
          if [ "$TEST_EXIT" = "0" ]; then echo "TESTS_PASSED=1" >> "$GITHUB_ENV"; else echo "TESTS_PASSED=0" >> "$GITHUB_ENV"; fi
          echo "Tests exited $TEST_EXIT — continuing to build the IPA regardless."
          exit 0

      # ── THE REAL PRODUCT: ios/build.sh — self-healing cascade + strict gate ──
      # Tries device build → archive → legacy build, validates the main
      # executable (exists, non-empty, arm64, LC_BUILD_VERSION platform 2),
      # strips test injection, and refuses to publish unless the final .ipa
      # passes the gate (Payload/PackWise.app/PackWise present, no test bundles).
      - name: Build unsigned IPA (device, arm64 — validated)
        id: ipa
        working-directory: ios
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee build/ci.log
          echo "BUILT_UNSIGNED_IPA=1" >> "$GITHUB_ENV"

      # ── Direct .ipa download (no outer zip) — versioned Release on tag v* ──
      - name: Publish to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v') && env.BUILT_UNSIGNED_IPA == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
          generate_release_notes: true

      # ── Direct .ipa — auto dev prerelease on every push to main ──
      - name: Publish dev prerelease (every main push — 1-click .ipa)
        if: github.ref == 'refs/heads/main' && env.BUILT_UNSIGNED_IPA == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: dev — latest main build
          prerelease: true
          generate_release_notes: true
          files: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256

      # ── Debug artifact — GitHub wraps this in an outer .zip on download ──
      - name: Upload unsigned IPA (debug artifact — unwrap once to .ipa)
        if: env.BUILT_UNSIGNED_IPA == '1'
        uses: actions/upload-artifact@v4
        with:
          name: PackWise-unsigned-ipa
          path: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      # ── Diagnostics are ALWAYS uploaded so any failure is publicly readable ──
      - name: Upload build diagnostics (always — readable without sign-in)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            ios/build/build.log
            ios/build/tests.log
            ios/build/ci.log
            ios/build/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### PackWise — iOS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${TESTS_PASSED:-0}" = "1" ]; then
            echo "✅ Tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Tests did not pass (non-blocking) — IPA still built" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${BUILT_UNSIGNED_IPA:-0}" = "1" ]; then
            echo "✅ **Unsigned IPA produced — \`PackWise-unsigned.ipa\`**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Validated: \`Payload/PackWise.app/PackWise\` present, arm64 device Mach-O, no test bundles" >> "$GITHUB_STEP_SUMMARY"
            echo "- Direct .ipa (no unwrap): **[dev](https://github.com/${{ github.repository }}/releases/tag/dev)** (every main push) and **[Latest](https://github.com/${{ github.repository }}/releases/latest)** (tag \`v*\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Artifact \`PackWise-unsigned-ipa\` is an outer zip — unwrap once to get the \`.ipa\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Verify: \`unzip -l PackWise-unsigned.ipa | grep Payload\` · \`shasum -a 256\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **No IPA produced** — see Build step log or the \`ios-build-diagnostics\` artifact." >> "$GITHUB_STEP_SUMMARY"
            if [ -f "ios/build/diagnostics.txt" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "<details><summary>Last diagnostics (from diagnostics.txt)</summary>" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              tail -n 60 ios/build/diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "TestFlight / App Store are **not** claimed — that requires Apple signing and App Store Connect processing (see ios/README.md)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Logs: [Live run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · [Wiki](https://github.com/$GITHUB_REPOSITORY/wiki) · [Releases](https://github.com/${{ github.repository }}/releases)" >> "$GITHUB_STEP_SUMMARY"
