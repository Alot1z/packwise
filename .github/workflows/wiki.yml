name: Wiki — Sync

on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/wiki.yml", "README.md", "assets/**"]
  workflow_dispatch:

# Without this, GITHUB_TOKEN is read-only: the "Enable wiki" PATCH and the
# .wiki push both fail silently (and the push step used to swallow the failure
# with continue-on-error, so the run showed green while the wiki never
# updated — the exact bug that made the wiki look "stuck").
permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Enabling has_wiki via the API requires `administration` permission,
      # which GITHUB_TOKEN does not have — use WIKI_PAT when it exists.
      # NOTE: enabling the flag alone does NOT create the wiki repo. GitHub
      # only materializes <repo>.wiki.git when a user creates the first page
      # in the web UI. That is a one-time manual step:
      #   https://github.com/Alot1z/packwise/wiki  →  "Create the first page"
      - name: Ensure wiki is enabled (idempotent)
        run: |
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${WIKI_PAT:-$GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            -d '{"has_wiki": true}' \
            && echo "wiki enabled" \
            || echo "⚠ could not enable wiki via API (may already be enabled) — continuing"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_PAT: ${{ secrets.WIKI_PAT }}

      - name: Push wiki/ to Alot1z/packwise.wiki
        # Deliberately NOT continue-on-error: a silent-green wiki is how this
        # broke before (token was read-only, pushes failed, runs stayed green).
        # A failed wiki sync now red-flags so it gets fixed instead of ignored.
        run: |
          set -e
          if [ ! -d wiki ]; then echo "No wiki/ dir — nothing to sync"; exit 0; fi
          echo "wiki/ contents:"; ls -lh wiki/
          WIKI_CRED="${WIKI_PAT:-$GITHUB_TOKEN}"
          WIKI_URL="https://x-access-token:${WIKI_CRED}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          # Probe whether the wiki repo exists. GitHub materializes .wiki.git
          # only after a user creates the first page in the web UI once:
          #   https://github.com/Alot1z/packwise/wiki → "Create the first page"
          if ! git ls-remote "$WIKI_URL" >/dev/null 2>&1; then
            echo "::error::Wiki repo (${GITHUB_REPOSITORY}.wiki.git) does not exist yet."
            echo "::error::GitHub creates it only after someone creates the FIRST wiki page in the web UI (one-time, 30 seconds):"
            echo "::error::  1. Open https://github.com/${GITHUB_REPOSITORY}/wiki"
            echo "::error::  2. Click 'Create the first page' (title: Home, any content)"
            echo "::error::  3. Save. Re-run this workflow — after that it syncs automatically on every push."
            exit 1
          fi

          rm -rf /tmp/wiki
          git clone --quiet "$WIKI_URL" /tmp/wiki
          # Sync files — keep Home.md as entry, copy all wiki/*.md
          rsync -av --delete wiki/ /tmp/wiki/ 2>&1 | tail -n 20
          # Ensure at least Home.md exists (GitHub Wiki needs it)
          if [ ! -f /tmp/wiki/Home.md ]; then
            cp wiki/Home.md /tmp/wiki/Home.md 2>/dev/null || echo "# PackWise Wiki" > /tmp/wiki/Home.md
          fi
          git -C /tmp/wiki config user.name "packwise-bot"
          git -C /tmp/wiki config user.email "bot@packwise.app"
          git -C /tmp/wiki add -A
          if git -C /tmp/wiki diff --cached --quiet; then
            echo "Wiki already up to date — nothing to push"
            exit 0
          fi
          git -C /tmp/wiki commit -m "Wiki sync from main @ ${GITHUB_SHA::7} — packwise-bot" || true
          git -C /tmp/wiki push origin HEAD:master 2>&1 | tail -n 15 || \
            git -C /tmp/wiki push origin HEAD:main 2>&1 | tail -n 15
          echo "✓ Wiki synced to https://github.com/${GITHUB_REPOSITORY}/wiki"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_PAT: ${{ secrets.WIKI_PAT }}
