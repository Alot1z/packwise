<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="PackWise architecture — SwiftUI, SwiftData, Vision, Notifications">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#e7d7c0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5ece0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3d2416" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#bg2)" stroke="#e7d7c0"/>
  <text x="32" y="38" font-family="Instrument Serif, Georgia, serif" font-size="18" fill="#1e140f">How PackWise is built — on device, offline, testable</text>
  <text x="32" y="58" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#8c735c" letter-spacing="0.8">SWIFTUI · SWIFTDATA · VISION · USERNOTIFICATIONS · MVVM · XCODEGEN — NO CLOUD</text>

  <!-- Pipeline -->
  <g font-family="DM Sans, sans-serif">
    <!-- UI -->
    <g filter="url(#cardShadow)">
      <rect x="32" y="92" width="220" height="96" rx="16" fill="url(#cardGrad)" stroke="#c9b9a6"/>
      <rect x="44" y="104" width="28" height="28" rx="8" fill="#1e140f"/>
      <text x="51" y="122" font-size="14" fill="white">◧</text>
      <text x="84" y="116" font-size="13" font-weight="700" fill="#1e140f">SwiftUI Views</text>
      <text x="84" y="134" font-size="10.5" fill="#6b5a4d">Dashboard · Trips · Scanner</text>
      <text x="84" y="150" font-size="10.5" fill="#6b5a4d">Library · Search · Settings</text>
      <text x="44" y="172" font-family="IBM Plex Mono, monospace" font-size="9" fill="#8c735c">FW: SwiftUI · NavigationStack</text>
    </g>
    <!-- arrow -->
    <text x="268" y="142" font-size="18" fill="#c9b9a6">→</text>
    <!-- VM/Services -->
    <g filter="url(#cardShadow)">
      <rect x="298" y="92" width="260" height="96" rx="16" fill="url(#cardGrad)" stroke="#c9b9a6"/>
      <rect x="310" y="104" width="28" height="28" rx="8" fill="#8b5a2b"/>
      <text x="317" y="122" font-size="14" fill="white">⚙</text>
      <text x="350" y="116" font-size="13" font-weight="700" fill="#1e140f">Services · ViewModels</text>
      <text x="350" y="134" font-size="10.5" fill="#6b5a4d">VisionService · Recommendation</text>
      <text x="350" y="150" font-size="10.5" fill="#6b5a4d">NotificationService</text>
      <text x="310" y="172" font-family="IBM Plex Mono, monospace" font-size="9" fill="#8c735c">RULE-BASED · CONFIRM-BEFORE-ADD</text>
    </g>
    <text x="574" y="142" font-size="18" fill="#c9b9a6">→</text>
    <!-- Models -->
    <g filter="url(#cardShadow)">
      <rect x="604" y="92" width="260" height="96" rx="16" fill="url(#cardGrad)" stroke="#c9b9a6"/>
      <rect x="616" y="104" width="28" height="28" rx="8" fill="#1e1b4b"/>
      <text x="623" y="122" font-size="13" fill="white">⬢</text>
      <text x="656" y="116" font-size="13" font-weight="700" fill="#1e140f">SwiftData Models</text>
      <text x="656" y="134" font-size="10.5" fill="#6b5a4d">Trip · PackingItem · Outfit</text>
      <text x="656" y="150" font-size="10.5" fill="#6b5a4d">PersonalItem · Reminder</text>
      <text x="616" y="172" font-family="IBM Plex Mono, monospace" font-size="9" fill="#8c735c">OFFLINE · MIGRATIONS · LOCAL</text>
    </g>
    <text x="880" y="142" font-size="18" fill="#c9b9a6">→</text>
    <!-- Device -->
    <g filter="url(#cardShadow)">
      <rect x="910" y="92" width="220" height="96" rx="16" fill="#1e140f" stroke="#1e140f"/>
      <rect x="922" y="104" width="28" height="28" rx="8" fill="white"/>
      <text x="929" y="122" font-size="14" fill="#1e140f">▣</text>
      <text x="962" y="116" font-size="13" font-weight="700" fill="white">On Device</text>
      <text x="962" y="134" font-size="10.5" fill="#c9b9a6">No cloud · No account</text>
      <text x="962" y="150" font-size="10.5" fill="#c9b9a6">Works in airplane mode</text>
      <text x="922" y="172" font-family="IBM Plex Mono, monospace" font-size="9" fill="#8c735c">PRIVATE BY DESIGN</text>
    </g>

    <!-- Bottom strip — frameworks -->
    <g font-family="IBM Plex Mono, monospace" font-size="9.5">
      <rect x="32" y="224" width="1098" height="52" rx="14" fill="white" stroke="#e7d7c0"/>
      <text x="48" y="244" fill="#1e140f" font-weight="700">FRAMEWORKS</text>
      <text x="48" y="262" fill="#6b5a4d">Vision + VisionKit (classify) · Photos + Camera (import/capture) · UserNotifications (local) · WidgetKit optional · XcodeGen → PackWise.xcodeproj</text>
    </g>

    <!-- Navigation strip -->
    <g font-family="IBM Plex Mono, monospace" font-size="9.5">
      <rect x="32" y="294" width="1098" height="52" rx="14" fill="#f5ece0" stroke="#e7d7c0"/>
      <text x="48" y="314" fill="#1e140f" font-weight="700">NAVIGATION — NO DEAD SCREENS</text>
      <text x="48" y="332" fill="#6b5a4d">Launch → Onboarding → Dashboard → Trips → Trip Detail → Packing List → Item Detail → Scanner → Outfit → Library → Search → Templates → Reminders → Settings</text>
    </g>

    <!-- Tests + Build -->
    <g font-family="IBM Plex Mono, monospace" font-size="9.5">
      <rect x="32" y="364" width="540" height="36" rx="12" fill="white" stroke="#e7d7c0"/>
      <text x="48" y="386" fill="#1e140f">TESTS · PackWiseTests · PackWiseUITests · Swift Testing + XCTest</text>
      <rect x="590" y="364" width="540" height="36" rx="12" fill="#1e140f"/>
      <text x="606" y="386" fill="white">BUILD · macos-15 · Xcode 16 · archive + DerivedData fallback → PackWise-unsigned.ipa</text>
    </g>
  </g>
</svg>
