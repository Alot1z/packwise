name: iOS — PackWise (Gitea)

on:
  push:
    branches: [main]
    paths: ["ios/**", ".gitea/workflows/ios.yml", ".github/workflows/ios.yml"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16*.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate && ls -lh PackWise.xcodeproj

      - name: Run tests (simulator, no signing — non-blocking)
        id: tests
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          echo "→ Running tests (never blocks archive)"
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild test -project PackWise.xcodeproj -scheme PackWise -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcpretty --color && echo "TESTS_PASSED=1" >> $GITHUB_ENV || echo "TESTS_PASSED=0" >> $GITHUB_ENV
          else
            xcodebuild test -project PackWise.xcodeproj -scheme PackWise -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/tests.log | tail -n 120; TEST_EXIT=${PIPESTATUS[0]}; if [ "$TEST_EXIT" = "0" ]; then echo "TESTS_PASSED=1" >> $GITHUB_ENV; else echo "TESTS_PASSED=0" >> $GITHUB_ENV; echo "Tests exited $TEST_EXIT — continuing"; fi
          fi
          exit 0

      - name: Archive — unsigned IPA (with build fallback)
        if: always()
        working-directory: ios
        run: |
          set -e
          rm -rf build/Payload build/PackWise-unsigned.ipa build/DerivedData
          echo "→ Attempt 1: xcodebuild archive"
          set +e
          xcodebuild archive -project PackWise.xcodeproj -scheme PackWise -configuration Release -destination "generic/platform=iOS" -archivePath build/PackWise.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -skipPackagePluginValidation -skipMacroValidation 2>&1 | tee build/archive.log | tail -n 80
          set -e
          APP=""
          if [ -f build/PackWise.xcarchive/Products/Applications/PackWise.app/Info.plist ]; then
            APP="build/PackWise.xcarchive/Products/Applications/PackWise.app"
          else
            echo "⚠️ Archive empty — fallback to build"
            xcodebuild build -project PackWise.xcodeproj -scheme PackWise -configuration Release -destination "generic/platform=iOS" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -n 80
            APP=$(find build/DerivedData -name "PackWise.app" -type d | head -n1 || true)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then echo "❌ No .app found"; find build -type d | head -n 60; ls -R build 2>&1 | head -n 120; exit 1; fi
          rm -rf build/Payload build/PackWise-unsigned.ipa
          mkdir -p build/Payload && cp -R "$APP" build/Payload/
          find build/Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          (cd build && zip -r -y PackWise-unsigned.ipa Payload >/dev/null)
          echo "BUILT_UNSIGNED_IPA=1" >> $GITHUB_ENV
          echo "--- IPA validation ---"
          ls -lh build/PackWise-unsigned.ipa && file build/PackWise-unsigned.ipa || true
          unzip -l build/PackWise-unsigned.ipa | head -n 24
          if ! unzip -l build/PackWise-unsigned.ipa | grep -q "Payload/PackWise.app/"; then echo "❌ IPA missing Payload/PackWise.app/"; exit 1; fi
          shasum -a 256 build/PackWise-unsigned.ipa | tee build/PackWise-unsigned.ipa.sha256
          du -sh build/Payload/PackWise.app || true

      - name: Upload unsigned IPA
        if: always() && env.BUILT_UNSIGNED_IPA == '1'
        uses: actions/upload-artifact@v4
        with:
          name: PackWise-unsigned-ipa
          path: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "### PackWise — iOS (Gitea)" >> $GITHUB_STEP_SUMMARY
          if [ "${TESTS_PASSED:-0}" = "1" ]; then echo "✅ Tests passed" >> $GITHUB_STEP_SUMMARY; else echo "⚠️ Tests non-blocking — see log" >> $GITHUB_STEP_SUMMARY; fi
          if [ "${BUILT_UNSIGNED_IPA:-0}" = "1" ]; then
            echo "✅ Unsigned IPA: PackWise-unsigned.ipa (Payload/PackWise.app — verify: unzip -l)" >> $GITHUB_STEP_SUMMARY
          else echo "❌ No IPA produced" >> $GITHUB_STEP_SUMMARY; fi
