name: iOS — PackWise (Gitea)

on:
  push:
    branches: [main]
    paths: ["ios/**", ".gitea/workflows/ios.yml", ".github/workflows/ios.yml", "scripts/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          # Pick the NEWEST installed Xcode (alphabetical glob would grab an old
          # one, e.g. Xcode_15.x, whose iOS platform may not match project.yml).
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ] && [ -d /Applications/Xcode.app ]; then XCODE=/Applications/Xcode.app; fi
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      # macOS-15 runner images trim the iOS DEVICE platform; xcodebuild then
      # fails instantly with "iOS 18.0 is not installed". Install on demand
      # (no-op if already present; sudo fallback for root-owned platform dir).
      - name: Install iOS device platform (on demand)
        run: |
          echo "→ xcodebuild -downloadPlatform iOS (no-op if already installed)"
          xcodebuild -downloadPlatform iOS 2>&1 | tail -n 8 || \
            { echo "→ retrying with sudo"; sudo xcodebuild -downloadPlatform iOS 2>&1 | tail -n 8; }
          xcodebuild -showsdks | grep -i iphoneos || echo "  (none listed — see output above)"

      - name: Install XcodeGen
        run: |
          # Same runner hygiene as the GitHub workflow: remove an unused
          # untrusted tap if present (never disable tap-trust globally) and fall
          # back to XcodeGen's official release binary if brew fails.
          brew untap aws/tap 2>/dev/null || true
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version 2>/dev/null || echo present)"
          elif brew install xcodegen; then
            echo "installed xcodegen via Homebrew: $(xcodegen --version 2>/dev/null || echo present)"
          else
            echo "brew failed — installing xcodegen from the official release binary"
            curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
            sudo mkdir -p /usr/local/bin
            sudo unzip -o /tmp/xcodegen.zip -d /usr/local/bin
            sudo chmod +x /usr/local/bin/xcodegen
            xcodegen --version
          fi

      # Failures here are emitted as ::error:: annotations (public in GitHub;
      # on Gitea they surface in the run log) so the root cause is never buried.
      - name: Generate Xcode project
        working-directory: ios
        run: |
          set +e
          OUTPUT=$(xcodegen generate 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT -ne 0 ]; then
            LAST=$(echo "$OUTPUT" | grep -iE 'error|invalid|failed|unexpected' | tail -n 3 | tr '\n' ' ')
            echo "::error::xcodegen generate failed (exit $EXIT): ${LAST:-see step log}"
            exit $EXIT
          fi
          ls -lh PackWise.xcodeproj

      - name: Run tests (simulator, no signing — non-blocking)
        id: tests
        continue-on-error: true
        working-directory: ios
        run: |
          # Same fix as the GitHub workflow: disable errexit around the test
          # pipeline so a test failure records TESTS_PASSED=0 and exits 0
          # instead of aborting the step with xcodebuild's exit code.
          mkdir -p build
          # Resolve a usable iPhone simulator at runtime (Xcode 26 doesn't ship
          # "iPhone 16" — query available devices and pick the first iPhone).
          SIM_DEST="platform=iOS Simulator,name=iPhone 17,OS=latest"
          if ! xcrun simctl list devices available "${SIM_DEST##name=}" 2>/dev/null | grep -q iPhone; then
            FIRST_IPHONE=$(xcrun simctl list devices available iPhone 2>/dev/null | grep -m1 -oE 'iPhone [0-9]+( Pro( Max)?)?' | head -1)
            if [ -n "$FIRST_IPHONE" ]; then
              SIM_DEST="platform=iOS Simulator,name=$FIRST_IPHONE,OS=latest"
              echo "→ no iPhone 17 simulator — using: $SIM_DEST"
            else
              echo "→ no iPhone simulator found — tests will be skipped (exit 0)"
              exit 0
            fi
          fi
          echo "→ Running tests on $SIM_DEST (never blocks the IPA build)"
          set +e
          xcodebuild test -project PackWise.xcodeproj -scheme PackWise \
            -destination "$SIM_DEST" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/tests.log | tail -n 120
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$TEST_EXIT" = "0" ]; then echo "TESTS_PASSED=1" >> "$GITHUB_ENV"; else echo "TESTS_PASSED=0" >> "$GITHUB_ENV"; fi
          echo "Tests exited $TEST_EXIT — continuing regardless."
          exit 0

      # Same self-healing, executable-validated pipeline as GitHub Actions.
      - name: Build unsigned IPA (device, arm64 — validated)
        id: ipa
        working-directory: ios
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee build/ci.log
          echo "BUILT_UNSIGNED_IPA=1" >> "$GITHUB_ENV"

      # Final gate — the same verifier users run locally.
      - name: Verify IPA (publish gate)
        if: env.BUILT_UNSIGNED_IPA == '1'
        run: ./scripts/verify-ipa.sh ios/build/PackWise-unsigned.ipa

      # Algorithm-friendly manifest — attached to every Gitea release so any
      # AI / script can fetch ONE URL to find the newest build. Schema:
      # packwise.releases/v1.
      - name: Generate release manifest
        if: env.BUILT_UNSIGNED_IPA == '1'
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          case "${GITHUB_REF:-}" in
            refs/tags/v*) TAG="${GITHUB_REF#refs/tags/}"; PREREL=0;;
            refs/heads/main|*) TAG="dev"; PREREL=1;;
          esac
          PRIOR=""
          if [ "$TAG" = "dev" ] && [ -n "${GITEA_API_URL:-}${GITEA_TOKEN:-}" ]; then
            echo "→ fetching prior manifest (best effort)"
            if curl -fsSL --retry 2 --max-time 20 \
                 -o _artifacts/prior.json \
                 "${GITEA_API_URL:-https://gitea.com/api/v1}/repos/${GITHUB_REPOSITORY}/releases/tags/dev/assets/PackWise-releases.json" 2>/dev/null; then
              if python3 -c "import json,sys;json.load(open('_artifacts/prior.json'))" 2>/dev/null; then
                PRIOR="--prior _artifacts/prior.json"
                echo "   loaded prior ($(wc -c <_artifacts/prior.json) bytes)"
              else
                echo "   prior was not JSON — discarding"
                rm -f _artifacts/prior.json
              fi
            else
              echo "   no prior manifest (first publish)"
              rm -f _artifacts/prior.json
            fi
          fi
          ./scripts/release-manifest.sh \
            --tag "$TAG" \
            --ipa ios/build/PackWise-unsigned.ipa \
            --output _artifacts/PackWise-releases.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verified \
            $([ "$PREREL" = "1" ] && echo --prerelease) \
            $PRIOR
          python3 -c "import json;assert json.load(open('_artifacts/PackWise-releases.json'))['schema']=='packwise.releases/v1';print('manifest validated')"

      - name: Upload unsigned IPA (debug artifact)
        if: env.BUILT_UNSIGNED_IPA == '1'
        uses: actions/upload-artifact@v7
        with:
          name: PackWise-unsigned-ipa
          path: |
            ios/build/PackWise-unsigned.ipa
            ios/build/PackWise-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      # Optional Gitea release publish — set GITEA_TOKEN (+ GITEA_API_URL) secret.
      - name: Publish dev release (Gitea API — only when GITEA_TOKEN is set)
        if: env.BUILT_UNSIGNED_IPA == '1' && env.GITEA_TOKEN != ''
        env:
          GITEA_API_URL: ${{ secrets.GITEA_API_URL || 'https://gitea.com/api/v1' }}
        run: |
          set -e
          API="${GITEA_API_URL}"
          EXISTING=$(curl -s -H "Authorization: token $GITEA_TOKEN" "$API/repos/${{ github.repository }}/releases/tags/dev" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            curl -s -X PATCH -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
              -d '{"name":"dev — latest main build","prerelease":true}' "$API/repos/${{ github.repository }}/releases/$EXISTING" >/dev/null
          else
            curl -s -X POST -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
              -d '{"tag_name":"dev","name":"dev — latest main build","prerelease":true,"target_commitish":"main"}' "$API/repos/${{ github.repository }}/releases" >/dev/null
          fi
          if [ -f "_artifacts/PackWise-releases.json" ]; then
            curl -s -X POST -H "Authorization: token $GITEA_TOKEN" \
              -F "attachment=@ios/build/PackWise-unsigned.ipa" \
              -F "attachment=@ios/build/PackWise-unsigned.ipa.sha256" \
              -F "attachment=@_artifacts/PackWise-releases.json" \
              "$API/repos/${{ github.repository }}/releases/tags/dev/assets" >/dev/null || true
          else
            curl -s -X POST -H "Authorization: token $GITEA_TOKEN" \
              -F "attachment=@ios/build/PackWise-unsigned.ipa" \
              -F "attachment=@ios/build/PackWise-unsigned.ipa.sha256" \
              "$API/repos/${{ github.repository }}/releases/tags/dev/assets" >/dev/null || true
          fi
          echo "Published to Gitea dev release (with manifest if available)."

      # Diagnostics always uploaded — failures stay readable.
      - name: Upload build diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-diagnostics
          path: |
            ios/build/build.log
            ios/build/tests.log
            ios/build/ci.log
            ios/build/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### PackWise — iOS (Gitea)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${TESTS_PASSED:-0}" = "1" ]; then echo "**Tests:** ✅ passed" >> "$GITHUB_STEP_SUMMARY"; elif [ "${TESTS_PASSED:-0}" = "0" ]; then echo "**Tests:** ⚠️ failed (non-blocking) — see tests.log" >> "$GITHUB_STEP_SUMMARY"; else echo "**Tests:** ⏭️ skipped" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "${BUILT_UNSIGNED_IPA:-0}" = "1" ]; then
            echo "✅ Unsigned IPA: \`PackWise-unsigned.ipa\` — validated (executable present, arm64 device, no test bundles)" >> "$GITHUB_STEP_SUMMARY"
            echo "Artifact: PackWise-unsigned-ipa (outer zip — unwrap to .ipa)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ No IPA produced — see \`ios-build-diagnostics\` artifact." >> "$GITHUB_STEP_SUMMARY"
            if [ -f "ios/build/diagnostics.txt" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "<details><summary>Last diagnostics</summary>" >> "$GITHUB_STEP_SUMMARY"
              tail -n 60 ios/build/diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
